name: Ganeshotsav CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: GitHub repository hygiene | no local dependencies or secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check tracked paths for local runtime files and secrets
        run: python3 scripts/check_git_staged.py --tracked

  backend-tests:
    name: FastAPI | Python 3.11 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run API tests
        run: python -m pytest -q

  frontend-build:
    name: React | Node.js 22 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Store compiled frontend as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ganeshotsav-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  postgres18-integration:
    name: PostgreSQL 18 | migration + real-DB synthetic E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ganesh_dev
          POSTGRES_PASSWORD: ci-only-local-password
          POSTGRES_DB: ganeshotsav_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ganesh_dev -d ganeshotsav_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ganesh_dev:ci-only-local-password@127.0.0.1:5432/ganeshotsav_dev
      JWT_SECRET: github-actions-fixture-only-secret-32-plus-characters
      RAZORPAY_MODE: test
      ENABLE_DEMO_CHECKOUT: "1"
      GANESH_QA_PASSWORD: ci-only-qa-admin-password-12345
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Apply Alembic migrations to PostgreSQL 18
        run: |
          python -m app.assert_local_target
          python -m alembic upgrade head
          python -m app.verify_database
      - name: Seed ephemeral test administrator
        run: python -m app.seed_admin --username admin --password-env GANESH_QA_PASSWORD
      - name: Exercise actual PostgreSQL via FastAPI TestClient
        run: python -m app.postgres_smoke --username admin --password-env GANESH_QA_PASSWORD
      - name: Test admin seva, 3 account registrations, demo booking and receipt on PostgreSQL 18
        run: python -m app.postgres_v5_smoke --username admin --password-env GANESH_QA_PASSWORD
